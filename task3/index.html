<html lang="en">

    <link rel="stylesheet" href="../style/style.css">
</head>
<body>
    <main class="task-page">
        <nav class="navigation" aria-label="Assignment navigation">
            <a class="list-link" href="../index.html">Home</a>
            <a class="list-link" href="../task0/index.html">Task 0</a>

        <section class="content-section">
            <h1 id="page-title" class="title">Task 3: Image Gallery</h1>
            <p class="paragraph">The gallery uses CSS Grid with responsive columns. Hover over an image to reveal its caption.</p>

            <section class="gallery">
                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open mountain landscape photo">
                        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Mountain landscape</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open city architecture photo">
                        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80" alt="City architecture" class="gallery-photo">
                    </a>
                    <figcaption class="caption">City architecture</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open forest photo">
                        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80" alt="Green forest" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Green forest</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open ocean photo">
                        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Blue ocean" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Blue ocean</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open desert photo">
                        <img src="https://images.unsplash.com/photo-1473580044384-7ba9967e16a0?auto=format&fit=crop&w=800&q=80" alt="Desert landscape" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Desert landscape</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open snowy mountain photo">
                        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Snowy mountain" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Snowy mountain</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open beach photo">
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Tropical beach" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Tropical beach</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open lake photo">
                        <img src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=800&q=80" alt="Lake between mountains" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Lake between mountains</figcaption>
                </figure>

                <figure class="gallery-item">
                    <a href="https://unsplash.com/" aria-label="Open night sky photo">
                        <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=800&q=80" alt="Stars in the night sky" class="gallery-photo">
                    </a>
                    <figcaption class="caption">Night sky</figcaption>
                </figure>
            </section>
        </section>
    </main>
</body>
